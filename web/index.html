<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- v1.30.0:应用更名 Toki(标题/描述/图标见 web icons 与 manifest.json)。
       v1.51.0:备案改名「百工箱」。 -->
  <meta name="description" content="百工箱 · Miuix 风格换算工具箱">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="百工箱">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>百工箱</title>
  <link rel="manifest" href="manifest.json">

  <!--
    v1.50.2：网站底部备案信息（ICP 备案）。
    工信部要求经营性/非经营性网站在首页底部标明备案号并链接到备案系统，
    与大部分网站做法一致：页脚居中、小字、可点击跳转 beian.miit.gov.cn。
    如需追加公安备案号，在 #beian 内另起一个 <a> 指向 beian.mps.gov.cn 即可。
  -->
  <style>
    #beian {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: 11px/20px system-ui, -apple-system, "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: #999;
      background: transparent;
      pointer-events: none; /* 不拦截 Flutter 手势 */
      z-index: 2147483647;
      user-select: none;
      -webkit-user-select: none;
    }

    #beian a {
      color: inherit;
      text-decoration: none;
      pointer-events: auto; /* 仅链接本身可点 */
    }

    #beian a:hover {
      text-decoration: underline;
    }

    @media (prefers-color-scheme: dark) {
      #beian {
        color: #8a8a8a;
      }
    }

    /* 给 Flutter 视口底部让出备案条高度，避免压住悬浮底栏胶囊。
       实测（Edge headless）：引擎会给 flutter-view 写内联像素尺寸
       （position:absolute; inset:0; width:Npx; height:Mpx），只覆盖 bottom
       会被内联 height 压掉 → 必须用 !important 覆盖 height。 */
    flutter-view {
      height: calc(100vh - 20px) !important;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- 网站底部备案信息（ICP 备案号；链接指向工信部备案管理系统） -->
  <div id="beian">
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">粤ICP备2026128498号-1</a>
  </div>
</body>
</html>
